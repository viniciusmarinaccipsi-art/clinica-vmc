<!DOCTYPE html>
<!-- Sistema Clínico Digital VMC — conectar.html — Pacote 14.8.1 (23/11/2026) -->
<!-- Página para onde o Google devolve o profissional depois da tela de permissão ("Conectar Google Agenda"). Abre em outra
     aba, entrega ao servidor o que o Google devolveu (state + code) e só diz o resultado: nenhum dado, nenhum link.
     Fica no site, e não no Apps Script, porque o Apps Script não abre a página quando há mais de uma conta do Google
     no navegador. O endereço desta página está cadastrado na chave do botão (Google Cloud): não renomear. -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<!-- CSP: o único destino de rede do script é o servidor (Apps Script e o endereço para onde ele redireciona a resposta). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COGNIATIVO</title>
<link rel="icon" href="marca/favicon.svg" type="image/svg+xml">
<link rel="icon" href="marca/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="marca/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="docs/design/tokens.css">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--c-bg);color:var(--c-ink);
    font-family:var(--f-text);font-size:16px;line-height:1.6;
  }
  .cx-wrap{max-width:520px;margin:0 auto;padding:24px 16px 48px;}
  .cx-marca{
    display:flex;align-items:flex-end;gap:6px;margin:8px 0 24px;
    font-family:var(--f-title);
  }
  .cx-marca-ico{display:block;flex-shrink:0;width:20px;height:20px;margin-bottom:1px;color:var(--c-action);}
  .cx-marca-nome{font-weight:600;font-size:22px;line-height:1;letter-spacing:-.01em;}
  .cx-card{
    background:var(--c-surface);border:1px solid var(--c-line);
    border-radius:var(--r-card);box-shadow:var(--sh-1);
    padding:28px 24px;
  }
  .cx-msg{margin:0;color:var(--c-ink);overflow-wrap:anywhere;}
</style>
</head>
<body>
<div class="cx-wrap">
  <div class="cx-marca">
    <svg class="cx-marca-ico" viewBox="0 0 64 64" aria-hidden="true"><path d="M47.32 19.14A20 20 0 1 0 47.32 44.86" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round"/><circle cx="32" cy="32" r="7.5" style="fill:var(--c-marca-ponto)"/></svg>
    <span class="cx-marca-nome">cogniativo</span>
  </div>
  <div class="cx-card">
    <p class="cx-msg" id="cxMsg" role="status" data-resultado="esperando">Concluindo a conexão…</p>
  </div>
</div>
<script>
(function () {
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx7kHrVq7KizCWCVeEhTpsBFcU36Vc1zUBWF1AuJxdPD3iO5K4LIPuZs2vXXr1OK94eAg/exec';
  var FRASE_OK = 'Agenda conectada. Você já pode fechar esta aba e voltar ao COGNIATIVO.';
  var FRASE_NAO = 'A conexão com o Google não foi concluída. Feche esta aba e tente de novo no COGNIATIVO.';
  var msg = document.getElementById('cxMsg');
  function mostrar(resultado) {
    msg.setAttribute('data-resultado', resultado);
    msg.textContent = resultado === 'conectada' ? FRASE_OK : FRASE_NAO;
  }
  var par;
  try { par = new URLSearchParams(window.location.search); } catch (e) { par = null; }
  var estado = par ? par.get('state') : '', codigo = par ? par.get('code') : '', recusa = par ? par.get('error') : '';
  // o que o Google devolveu sai do endereço na hora: não fica no histórico nem volta a ser enviado se a aba recarregar
  try { window.history.replaceState(null, '', window.location.pathname); } catch (e) { /* segue */ }
  if (!estado) { mostrar('erro'); return; }
  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ acao: 'concluirConexaoAgenda', state: estado, code: codigo || '', error: recusa || '' })
  }).then(function (r) { return r.json(); })
    .then(function (d) { mostrar(d && d.resultado === 'conectada' ? 'conectada' : (d && d.resultado === 'negada' ? 'negada' : 'erro')); })
    .catch(function () { mostrar('erro'); });
})();
</script>
</body>
</html>
