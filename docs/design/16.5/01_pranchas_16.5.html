document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 catálogo). Ícones: 16.5/icones.js.\nconst CATALOGO = {\"neg\":{\"sit\":{\"nome\":\"Situação\",\"grupos\":[{\"n\":1,\"titulo\":\"Situações Interpessoais\",\"chave\":\"neg_sit_tipo_interpessoais\",\"desc\":\"Marque quando envolveu interações com outras pessoas\",\"itens\":[\"Ser comparado com algo ou alguém\",\"Receber críticas ou feedbacks negativos\",\"Conflitos, brigas ou discussões com outra pessoa\",\"Ser rejeitado, ignorado ou excluído numa situação\",\"Ver-se incompreendido, invalidado ou desrespeitado\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":2,\"titulo\":\"Situações de Desempenho\",\"chave\":\"neg_sit_tipo_desempenho\",\"desc\":\"Marque quando envolveu avaliações sobre tarefas e resultados\",\"itens\":[\"Acúmulo de tarefas ou sobrecarga\",\"Realizar tarefas novas ou desafiadoras\",\"Receber pressão por prazos ou cobranças\",\"Avaliação ou exposição diante de outras pessoas\",\"Lidar com erros, falhas ou resultados abaixo do esperado\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":3,\"titulo\":\"Situações de Solidão / Inatividade\",\"chave\":\"neg_sit_tipo_solidao\",\"desc\":\"Marque quando envolveu estar sozinho ou sem atividades\",\"itens\":[\"Lidar com o tédio e ociosidade\",\"Estar sozinho e/ou sem atividades\",\"Perceber-se inútil ou sem relevância\",\"Cancelamento de planos ou expectativas frustradas\",\"Sentir-se solitário e vazio em momentos específicos do dia\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":4,\"titulo\":\"Situações de Perda ou Mudança\",\"chave\":\"neg_sit_tipo_perda\",\"desc\":\"Marque quando envolveu perdas, mudanças ou incertezas\",\"itens\":[\"Ter incertezas sobre o futuro\",\"Passar por dificuldades financeiras\",\"Mudanças inesperadas na rotina ou planos\",\"Perda ou afastamento de alguém importante\",\"Problemas de saúde (próprios ou de alguém próximo)\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":5,\"titulo\":\"Situações Internas (sem evento externo claro)\",\"chave\":\"neg_sit_tipo_internas\",\"desc\":\"Marque quando envolveu gatilhos internos - sem um evento externo definido\",\"itens\":[\"Lembranças ou memórias indesejadas\",\"Ruminando o que eu deveria fazer ou ter feito\",\"Sensações físicas e emocionais desagradáveis\",\"Pensamentos intrusivos que \\\"surgiram do nada\\\"\",\"Imaginar como as coisas deveriam ser diferentes\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"}],\"legenda\":null,\"rotulo\":null},\"emo\":{\"nome\":\"Emoções Desagradáveis\",\"grupos\":[{\"n\":1,\"titulo\":\"Tristeza / Depressão\",\"chave\":\"neg_emo_tristeza\",\"desc\":\"\\\"Quando sentimos que perdemos algo importante, que as coisas não estão bem conosco ou que o futuro parece sem esperança.\\\"\",\"itens\":[\"Triste\",\"Solitário(a)\",\"Deprimido(a)\",\"Desanimado(a)\",\"Desesperançoso(a)\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":2,\"titulo\":\"Ansiedade / Medo\",\"chave\":\"neg_emo_ansiedade\",\"desc\":\"\\\"Quando percebemos perigo ou ameaça, sentimos que algo ruim pode acontecer ou temos incertezas sobre o futuro.\\\"\",\"itens\":[\"Ansioso(a)\",\"Inseguro(a)\",\"Apreensivo(a)\",\"Preocupado(a)\",\"Amedrontado(a)\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":3,\"titulo\":\"Raiva / Irritação\",\"chave\":\"neg_emo_raiva\",\"desc\":\"\\\"Quando não concordamos com algo, sentimos que fomos tratados de forma injusta ou desrespeitados.\\\"\",\"itens\":[\"Irritado(a)\",\"Furioso(a)\",\"Ofendido(a)\",\"Frustrado(a)\",\"Indignado(a)\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":4,\"titulo\":\"Culpa / Vergonha\",\"chave\":\"neg_emo_culpa\",\"desc\":\"\\\"Quando sentimos que cometemos um erro ou que há algo inadequado em nossas atitudes ou comportamentos.\\\"\",\"itens\":[\"Culpado(a)\",\"Humilhado(a)\",\"Arrependido(a)\",\"Constrangido(a)\",\"Envergonhado(a)\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":5,\"titulo\":\"Ciúme / Inveja\",\"chave\":\"neg_emo_ciume\",\"desc\":\"\\\"Quando sentimos que um relacionamento está ameaçado ou que outros possuem algo que admiramos ou desejamos.\\\"\",\"itens\":[\"Invejoso(a)\",\"Possessivo(a)\",\"Enciumado(a)\",\"Amargurado(a)\",\"Desconfiado(a)\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"}],\"legenda\":[\"Nenhum\",\"Pouco\",\"Moderado\",\"Muito\",\"Intenso\"],\"rotulo\":\"Desconforto:\"},\"fis\":{\"nome\":\"Reações Físicas de Mal-Estar\",\"grupos\":[{\"n\":1,\"titulo\":\"Ativação / Aceleração\",\"chave\":\"neg_fis_ativacao\",\"desc\":\"\\\"Quando as sensações corporais envolvem um estado de alerta ou preparação para agir diante de uma ameaça ou perigo.\\\"\",\"itens\":[\"Coração acelerado\",\"Tremores ou estremecimentos\",\"Respiração rápida ou ofegante\",\"Sudorese ou calafrios repentinos\",\"Agitação (dificuldade em ficar parado)\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":2,\"titulo\":\"Desativação / Lentificação\",\"chave\":\"neg_fis_desativacao\",\"desc\":\"\\\"Quando as sensações corporais envolvem um estado de apatia, como se faltassem forças, ânimo ou energia.\\\"\",\"itens\":[\"Cansaço ou fadiga\",\"Sensação de esgotamento\",\"Lentificação nos movimentos\",\"Falta de energia ou disposição\",\"Falta de interesse ou motivação\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":3,\"titulo\":\"Tensão / Contração\",\"chave\":\"neg_fis_tensao\",\"desc\":\"\\\"Quando as sensações corporais envolvem contrações ou rigidez muscular diante de algo estressante, ou que nos causa repudio e desaprovação.\\\"\",\"itens\":[\"Tensão ou rigidez muscular\",\"Aperto ou pressão no peito\",\"Punhos ou mandíbula cerrados\",\"Ombros e pescoço enrijecidos\",\"Peso ou dores na região da cabeça\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":4,\"titulo\":\"Alterações Digestivas\",\"chave\":\"neg_fis_digestivas\",\"desc\":\"\\\"Quando as sensações corporais se manifestam na região do estomago e abdômen, ou interferem em nosso sistema digestivo ou apetite.\\\"\",\"itens\":[\"Boca seca ou salivação alterada\",\"Enjoo, náuseas ou desconfortos abdominais\",\"Alterações no apetite (comer mais ou menos)\",\"Intestino alterado (diarreia ou prisão de ventre)\",\"Estômago embrulhado ou irritado (queimação – azia)\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":5,\"titulo\":\"Alterações no Sono e Concentração\",\"chave\":\"neg_fis_sono\",\"desc\":\"\\\"Quando as sensações corporais interferem nossa percepção da realidade, estado de alerta, atenção, sono e vigília.\\\"\",\"itens\":[\"Dificuldades para dormir\",\"Dificuldades de concentração\",\"Despertares noturnos ou muito cedo\",\"Confusão mental (dissossiação e/ou despersonalização)\",\"Mente acelerada (dificuldades para desligar – pensamentos intrusivos)\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"}],\"legenda\":[\"Nenhum\",\"Pouco\",\"Moderado\",\"Muito\",\"Extremo\"],\"rotulo\":\"Mal-estar:\"},\"pens\":{\"nome\":\"Pensamentos Desadaptativos\",\"grupos\":[{\"n\":1,\"titulo\":\"Pensamentos sobre Mim Mesmo (Autocrítica)\",\"chave\":\"neg_pens_sobre_mim\",\"desc\":\"\\\"Quando meus pensamentos são duros comigo mesmo.\\\"\",\"itens\":[\"\\\"Não sou bom o bastante ou suficiente\\\"\",\"\\\"Não sou digno de ser amado ou valorizado\\\"\",\"\\\"Sou problemático: há algo de errado comigo\\\"\",\"\\\"Sou fracasso e não consigo lidar com as coisas\\\"\",\"\\\"Sou uma farsa: me vejo incapaz ou incompetente\\\"\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":2,\"titulo\":\"Pensamentos sobre o Futuro\",\"chave\":\"neg_pens_sobre_futuro\",\"desc\":\"\\\"Quando minha mente antecipa o pior cenário.\\\"\",\"itens\":[\"\\\"E se tudo der errado comigo?\\\"\",\"\\\"Algo terrível poderá acontecer\\\"\",\"\\\"Não serei capaz de lidar com isso\\\"\",\"\\\"Nunca vou melhorar ou sair dessa situação\\\"\",\"\\\"O futuro é desesperador ou sem esperança\\\"\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":3,\"titulo\":\"Pensamentos sobre os Outros\",\"chave\":\"neg_pens_sobre_outros\",\"desc\":\"\\\"Quando interpreto as intenções dos outros de forma negativa.\\\"\",\"itens\":[\"\\\"Não posso confiar nas outras pessoas\\\"\",\"\\\"Ninguém se importa comigo de verdade\\\"\",\"\\\"As pessoas me julgam ou não gostam de mim\\\"\",\"\\\"Estou sendo usado ou explorado pelos outros\\\"\",\"\\\"Estão sendo injustos comigo ou me desrespeitando\\\"\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":4,\"titulo\":\"Pensamentos de Cobrança\",\"chave\":\"neg_pens_cobranca\",\"desc\":\"\\\"Quando me cobro ou cobro os outros com regras inflexíveis.\\\"\",\"itens\":[\"\\\"Não posso errar ou falhar\\\"\",\"\\\"Eu deveria dar conta de tudo\\\"\",\"\\\"Eu precisava ser mais forte ou melhor\\\"\",\"\\\"As pessoas deveriam agir de outra forma\\\"\",\"\\\"Se não estiver perfeito, então não valerá a pena\\\"\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":5,\"titulo\":\"Pensamentos de Culpa / Autocondenação\",\"chave\":\"neg_pens_culpa\",\"desc\":\"\\\"Quando me responsabilizo excessivamente.\\\"\",\"itens\":[\"\\\"Eu não deveria ter feito ou dito aquilo\\\"\",\"\\\"Mereço o que está acontecendo comigo\\\"\",\"\\\"A culpa é minha, sou responsável por isso\\\"\",\"\\\"Decepcionei, desapontei ou magoei as pessoas\\\"\",\"\\\"Se souberem quem eu realmente sou vão me rejeitar\\\"\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"}],\"legenda\":[\"Nada\",\"Pouco\",\"Moderado\",\"Muito\",\"Totalmente\"],\"rotulo\":\"Acredito:\"},\"comp\":{\"nome\":\"Comportamentos Disfuncionais\",\"grupos\":[{\"n\":1,\"titulo\":\"Evitação / Fuga\",\"chave\":\"neg_comp_evitacao\",\"desc\":\"\\\"Quando tentamos nos afastar daquilo que nos causa desconforto.\\\"\",\"itens\":[\"Saí ou fugi de situações ou lugares\",\"Cancelei compromissos e obrigações\",\"Não respondi as mensagens ou ligações\",\"Procrastinei ou adiei tarefas importantes\",\"Evitei pessoas e/ou me expor às interações\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":2,\"titulo\":\"Isolamento / Retraimento\",\"chave\":\"neg_comp_isolamento\",\"desc\":\"\\\"Quando nos retraimos ou nos fechamos em nós mesmos.\\\"\",\"itens\":[\"Fiquei em silêncio ou me resguardei\",\"Me afastei das pessoas ou evitei o contato\",\"Aceitei passivamente as situações que incomodam\",\"Deixei de fazer atividades que antes eram prazerosas\",\"Tive dificuldades para iniciar ou manter minhas obrigações\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":3,\"titulo\":\"Agitação / Reatividade\",\"chave\":\"neg_comp_reatividade\",\"desc\":\"\\\"Quando agimos de forma impulsiva ou explosiva.\\\"\",\"itens\":[\"Critiquei ou ataquei verbalmente alguém\",\"Discuti, gritei, briguei ou busquei o conflito\",\"Bati, quebrei ou arremessei coisas e objetos\",\"Agi impulsivamente sem pensar nas consequências\",\"Fui agressivo e/ou me expus a riscos desnecessários\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":4,\"titulo\":\"Entorpecimento / Fuga emocional\",\"chave\":\"neg_comp_entorpecimento\",\"desc\":\"\\\"Quando buscamos aliviar ou anestesiar o que sentimos.\\\"\",\"itens\":[\"Comi em excesso ou compulsivamente\",\"Dormi em excesso para \\\"fugir\\\" do que senti\",\"Fiz compras impulsivas ou gastos excessivos\",\"Uso de álcool ou drogas para lidar com emoções\",\"Uso excessivo de telas (internet, redes sociais, TV)\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":5,\"titulo\":\"Busca excessiva de controle / Reasseguramento\",\"chave\":\"neg_comp_controle\",\"desc\":\"\\\"Quando tentamos controlar tudo ou buscamos aprovação.\\\"\",\"itens\":[\"Tentei ser perfeito ou controlar cada detalhe\",\"Busquei por afirmação e/ou validação emocional\",\"Fiz verificações repetidas em busca de segurança\",\"Queixei-me ou reclamei repetidamente do problema\",\"Ruminei o problema: \\\"mastiguei\\\" mentalmente o ocorrido\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"}],\"legenda\":null,\"rotulo\":null}},\"pos\":{\"sit\":{\"nome\":\"Situação\",\"grupos\":[],\"legenda\":null,\"rotulo\":null},\"emo\":{\"nome\":\"Emoções Agradáveis\",\"grupos\":[{\"n\":1,\"titulo\":\"Felicidade / Satisfação\",\"chave\":\"pos_emo_felicidade\",\"desc\":\"\\\"Quando nos sentimos bem com o momento presente.\\\"\",\"itens\":[\"Alegre\",\"Contente\",\"Divertido(a)\",\"Satisfeito(a)\",\"Entusiasmado(a)\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":2,\"titulo\":\"Orgulho / Realização\",\"chave\":\"pos_emo_orgulho\",\"desc\":\"\\\"Quando reconhecemos nossas capacidades e conquistas.\\\"\",\"itens\":[\"Confiante\",\"Realizado(a)\",\"Orgulhoso(a)\",\"Determinado(a)\",\"Empoderado(a)\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":3,\"titulo\":\"Conexão / Afeto\",\"chave\":\"pos_emo_conexao\",\"desc\":\"\\\"Quando nos sentimos próximos e ligados a outras pessoas.\\\"\",\"itens\":[\"Grato(a)\",\"Amoroso(a)\",\"Acolhido(a)\",\"Afetuoso(a)\",\"Compassivo(a)\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":4,\"titulo\":\"Calma / Serenidade\",\"chave\":\"pos_emo_calma\",\"desc\":\"\\\"Quando experimentamos tranquilidade interior e paz.\\\"\",\"itens\":[\"Calmo(a)\",\"Sereno(a)\",\"Seguro(a)\",\"Aliviado(a)\",\"Tranquilo(a)\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":5,\"titulo\":\"Esperança / Motivação\",\"chave\":\"pos_emo_esperanca\",\"desc\":\"\\\"Quando olhamos para o futuro com confiança.\\\"\",\"itens\":[\"Otimista\",\"Curioso(a)\",\"Motivado(a)\",\"Inspirado(a)\",\"Esperançoso(a)\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"}],\"legenda\":[\"Nenhum\",\"Pouco\",\"Moderado\",\"Muito\",\"Intenso\"],\"rotulo\":\"Conforto:\"},\"fis\":{\"nome\":\"Reações Físicas de Bem-Estar\",\"grupos\":[{\"n\":1,\"titulo\":\"Desaceleração / Calma\",\"chave\":\"pos_fis_calma\",\"desc\":\"\\\"Quando o corpo desacelera de forma agradável.\\\"\",\"itens\":[\"Frequência cardíaca regular\",\"Respiração lenta e profunda\",\"Ausência de tremores ou sudorese\",\"Consciência corporal de conforto e segurança\",\"Sensação de equilíbrio e estabilidade corporal\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":2,\"titulo\":\"Energia / Vitalidade\",\"chave\":\"pos_fis_energia\",\"desc\":\"\\\"Quando o corpo se sente ativo e com vigor.\\\"\",\"itens\":[\"Energia e disposição física\",\"Motivação para realizar atividades\",\"Sensação de estar pleno e revigorado\",\"Percepções corpóreas de força e vitalidade\",\"Mente alerta e consciência plena dos movimentos\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":3,\"titulo\":\"Relaxamento / Soltura\",\"chave\":\"pos_fis_relaxamento\",\"desc\":\"\\\"Quando os músculos e o corpo se soltam.\\\"\",\"itens\":[\"Musculatura distensionada\",\"Ombros e pescoço relaxados\",\"Sensação de leveza na cabeça\",\"Mãos e mandíbula descontraídos\",\"Peito aberto e respiração confortável\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":4,\"titulo\":\"Conforto Digestivo\",\"chave\":\"pos_fis_digestivo\",\"desc\":\"\\\"Quando a região do estômago está confortável.\\\"\",\"itens\":[\"Boca hidratada\",\"Apetite regular e equilibrado\",\"Digestão tranquila e confortável\",\"Funcionamento intestinal regular\",\"Estômago calmo e sem desconforto\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":5,\"titulo\":\"Atenção / Descanso\",\"chave\":\"pos_fis_atencao\",\"desc\":\"\\\"Quando a mente está desperta e o corpo descansado.\\\"\",\"itens\":[\"Mente tranquila e desperta\",\"Sono reparador e restaurador\",\"Atenção e foco no momento presente\",\"Concentração e raciocínio preservados\",\"Lucidez e organização nos pensamentos\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"}],\"legenda\":[\"Nenhum\",\"Pouco\",\"Moderado\",\"Muito\",\"Extremo\"],\"rotulo\":\"Bem-estar:\"},\"pens\":{\"nome\":\"Pensamentos Adaptativos\",\"grupos\":[{\"n\":1,\"titulo\":\"Autocompaixão\",\"chave\":\"pos_pens_autocompaixao\",\"desc\":\"\\\"Quando consigo ser gentil comigo mesmo.\\\"\",\"itens\":[\"\\\"Mereço cuidar de mim\\\"\",\"\\\"Errar faz parte de ser humano\\\"\",\"\\\"Tenho qualidades e pontos fortes\\\"\",\"\\\"Posso aprender com esta experiência\\\"\",\"\\\"Estou fazendo o melhor que posso neste momento\\\"\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":2,\"titulo\":\"Esperança / Perspectiva\",\"chave\":\"pos_pens_esperanca\",\"desc\":\"\\\"Quando consigo ver além do momento difícil.\\\"\",\"itens\":[\"\\\"O futuro ainda está aberto\\\"\",\"\\\"Isso é temporário — vai passar\\\"\",\"\\\"Posso dar um passo de cada vez\\\"\",\"\\\"Já enfrentei coisas difíceis antes e superei\\\"\",\"\\\"Existem coisas que posso fazer para melhorar\\\"\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":3,\"titulo\":\"Confiança nos Outros\",\"chave\":\"pos_pens_confianca\",\"desc\":\"\\\"Quando consigo considerar as intenções dos outros de forma equilibrada.\\\"\",\"itens\":[\"\\\"Posso dar o benefício da dúvida\\\"\",\"\\\"Posso pedir ajuda sem ser um fardo\\\"\",\"\\\"Existem pessoas que se importam comigo\\\"\",\"\\\"Talvez a pessoa não tenha tido a intenção de me magoar\\\"\",\"\\\"Nem tudo é sobre mim — as pessoas têm seus próprios problemas\\\"\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":4,\"titulo\":\"Flexibilidade / Equilíbrio\",\"chave\":\"pos_pens_flexibilidade\",\"desc\":\"\\\"Quando consigo substituir regras rígidas por expectativas realistas.\\\"\",\"itens\":[\"\\\"Nem tudo depende de mim\\\"\",\"\\\"Bom o suficiente também é bom\\\"\",\"\\\"As pessoas são diferentes — e tudo bem\\\"\",\"\\\"Posso aceitar o que não está no meu controle\\\"\",\"\\\"Posso fazer o meu melhor sem exigir perfeição\\\"\"],\"outro\":\"Outro:\",\"outroDica\":\"especifique...\"},{\"n\":5,\"titulo\":\"Responsabilidade Equilibrada\",\"chave\":\"pos_pens_responsabilidade\",\"desc\":\"\\\"Quando consigo avaliar minha responsabilidade de forma justa. eys(s)) for (const t of Object.keys(s[gn])) out.push({ t, n: s[gn][t] }); return out; };\n\n    const buildGrupos = (reg, key) => {\n      const et = cat[reg][key]; const c = C[reg];\n      return et.grupos.map(g => {\n        const sel = (cen[reg].sel[key] || {})[g.n] || {};\n        const k = Object.keys(sel).length;\n        const open = (cen[reg].open[key] || []).includes(g.n);\n        const itens = g.itens.map(t => ({ t, sel: t in sel, unsel: !(t in sel) }));\n        const escalas = et.legenda ? Object.keys(sel).map(item => {\n          const nota = sel[item];\n          return { item, rotulo: et.rotulo, nota, notaTxt: nota + ' · ' + et.legenda[nota - 1],\n            pontos: et.legenda.map((palavra, i) => ({ n: i + 1, palavra, on: i + 1 === nota, off: i + 1 !== nota })) };\n        }) : [];\n        return { n: g.n, titulo: g.titulo, desc: g.desc, open, closed: !open, itens, escalas, hasEscala: escalas.length > 0,\n          countLabel: k ? (k + (k > 1 ? ' marcados' : ' marcado')) : (g.itens.length + ' itens'), countColor: k ? c.ink : '#5E5B73' };\n      });\n    };\n\n    const cabLines = (reg, uptoIdx) => {\n      const c = C[reg]; const h = cen[reg].humor;\n      const lines = [{ icon: I('i-humor-' + h), label: 'Humor', parts: [{ t: HUM[h - 1], fs: 'normal', color: '#1D1B2B' }] }];\n      for (let i = 0; i < uptoIdx; i++) {\n        const key = KEYS[i]; const et = cat[reg][key]; const parts = [];\n        const sels = selOf(reg, key);\n        const isPosSit = reg === 'pos' && key === 'sit';\n        if (!isPosSit) sels.forEach((s, j) => parts.push({ t: (j ? ' · ' : '') + s.t, n: et.legenda ? s.n : 0, fs: 'normal', color: '#1D1B2B' }));\n        const frase = cen[reg].texto[key];\n        if (frase) parts.push({ t: (parts.length ? ' · ' : '') + frase, n: 0, fs: 'italic', color: '#3F3C52' });\n        // corte em até duas linhas (~62 caracteres a 14px na coluna de 200px), a partir da frase\n        const LIM = 62; let used = 0;\n        for (const p of parts) { const extra = p.n ? 2 : 0; if (used + p.t.length + extra > LIM) { p.t = p.t.slice(0, Math.max(0, LIM - used - extra - 1)).replace(/\\s+$/, '') + '…'; if (p.n) p.n = 0; } used += p.t.length + extra; }\n        lines.push({ icon: c.icons[key], label: CAB[key], parts: parts.filter(p => p.t.length > 1) });\n      }\n      return lines;\n    };\n\n    const etapa = (reg, key, opts = {}) => {\n      const c = C[reg]; const idx = KEYS.indexOf(key); const et = cat[reg][key];\n      const total = selOf(reg, key).length;\n      const nomes = KEYS.map(k => cat[reg][k].nome);\n      const isText = key === 'sit' || key === 'pens' || key === 'comp';\n      const refObs = key === 'sit' && reg === 'neg' ? cen[reg].obs : null;\n      const dica = key === 'sit' ? (refObs ? tx.dica.sitComObs : tx.dica.sit) : (tx.dica[key] || '');\n      const gruposAll = (reg === 'pos' && key === 'sit') ? [] : buildGrupos(reg, key);\n      return {\n        id: opts.id, anchor: opts.anchor, legenda: opts.legenda, c, n: idx + 1, nome: et.nome,\n        trail: KEYS.map((k, i) => ({ bg: i < idx ? c.reg : i === idx ? c.mid : c.tint })),\n        cab: cabLines(reg, idx),\n        titulo: tx.etapaTitulo[key], instrucao: tx.instrucao[reg][key],\n        hasText: isText, isPens: key === 'pens', refObs, dica,\n        textValue: opts.vazio ? '' : (cen[reg].texto[key] || ''), textStyle: key === 'pens' ? 'italic 400' : '400',\n        erro: opts.erro || '', semErro: !opts.erro,\n        tipoRotulo: tx.tipoRotulo[key] && (tx.tipoFrase[reg] || {})[key] ? tx.tipoRotulo[key] : '', tipoFrase: (tx.tipoFrase[reg] || {})[key] || '',\n        grupos: gruposAll,\n        contagem: total ? total + ' ' + UNID[key][total > 1 ? 1 : 0] : 'Nada marcado ainda',\n        proximo: idx < 4 ? nomes[idx + 1] + ' ›' : 'Concluir e Revisar'\n      };\n    };\n\n    const etapas = [\n      etapa('neg', 'sit', { id: 'AUT-04', anchor: 'aut-04', legenda: 'Etapa 1 · Situação' }),\n      etapa('neg', 'emo', { id: 'AUT-05', anchor: 'aut-05', legenda: 'Etapa 2 · Emoções Desagradáveis' }),\n      etapa('neg', 'fis', { id: 'AUT-06', anchor: 'aut-06', legenda: 'Etapa 3 · Reações Físicas de Mal-Estar' }),\n      etapa('neg', 'pens', { id: 'AUT-07', anchor: 'aut-07', legenda: 'Etapa 4 · Pensamentos Desadaptativos (cartão de ajuda aberto)' }),\n      etapa('neg', 'comp', { id: 'AUT-08', anchor: 'aut-08', legenda: 'Etapa 5 · Comportamentos Disfuncionais' }),\n      etapa('pos', 'emo', { id: 'AUT-08p', anchor: 'aut-08p', legenda: 'Registro Positivo · Etapa 2 · Emoções Agradáveis' }),\n      etapa('neg', 'sit', { id: 'AUT-12', anchor: 'aut-12a', legenda: 'estado · aviso de campo obrigatório na tela', vazio: true, erro: tx.obrigatorio.sitTexto })\n    ];\n\n    // AUT-09\n    const pct = n => Math.round(n / 5 * 100) + '%';\n    const rowsOf = key => selOf('neg', key).map(s => ({ t: s.t, nota: s.n, pct: pct(s.n), aria: cat.neg[key].rotulo + ' ' + s.n + ' de 5' }));\n    const cnt = key => selOf('neg', key).length;\n    const revisao = [\n      { icon: I('i-pin'), label: 'Situação', frase: cen.neg.texto.sit, fraseStyle: '400', hasChips: true, chips: selOf('neg', 'sit').map(s => s.t), rows: [] },\n      { icon: I('i-heart-crack'), label: cat.neg.emo.nome + ' · ' + cnt('emo'), frase: '', hasChips: false, chips: [], rows: rowsOf('emo') },\n      { icon: I('i-zap'), label: cat.neg.fis.nome + ' · ' + cnt('fis'), frase: '', hasChips: false, chips: [], rows: rowsOf('fis') },\n      { icon: I('i-cloud-rain'), label: cat.neg.pens.nome + ' · ' + cnt('pens'), frase: cen.neg.texto.pens, fraseStyle: 'italic 400', hasChips: false, chips: [], rows: rowsOf('pens') },\n      { icon: I('i-trend-down'), label: cat.neg.comp.nome + ' · ' + cnt('comp'), frase: cen.neg.texto.comp, fraseStyle: '400', hasChips: true, chips: selOf('neg', 'comp').map(s => s.t), rows: [] }\n    ];\n\n    // AUT-11 (computador) — etapa 4, Pensamentos\n    const dBase = etapa('neg', 'pens', { id: 'AUT-11' });\n    const cur = 3;\n    const d = Object.assign({}, dBase, {\n      passos: KEYS.map((k, i) => {\n        const done = i < cur, current = i === cur;\n        return { n: i + 1, nome: cat.neg[k].nome, icon: C.neg.icons[k], done, notDone: !done, current: current ? 'step' : 'false',\n          bg: current ? C.neg.tint : 'transparent', dotBg: done ? C.neg.reg : current ? '#FFFFFF' : 'transparent', dotInk: done ? '#F7F6FB' : current ? C.neg.ink : '#5E5B73',\n          dotLine: done ? C.neg.reg : current ? C.neg.reg : '#D6D5E4', ink: i > cur ? '#5E5B73' : '#1D1B2B', fw: current ? 600 : 400 };\n      }),\n      anotado: [\n        { icon: I('i-humor-3'), label: 'Humor', texto: HUM[cen.neg.humor - 1], textoStyle: '600', hasChips: false, chips: [], rows: [] },\n        { icon: I('i-pin'), label: 'Situação', texto: cen.neg.texto.sit, textoStyle: '400', hasChips: true, chips: selOf('neg', 'sit').map(s => s.t), rows: [] },\n        { icon: I('i-heart-crack'), label: 'Emoções', texto: '', hasChips: false, chips: [], rows: rowsOf('emo') },\n        { icon: I('i-zap'), label: 'Reações físicas', texto: '', hasChips: false, chips: [], rows: rowsOf('fis') }\n      ]\n    });\n\n    return { etapas, revisao, ajuda: tx.ajuda.itens, ajudaIntro: tx.ajuda.intro, d };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
